name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Validate evidence inputs
        run: npm run evaluate:check && npm run benchmark:sound:check
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test the root production export
        run: npm run test:site
        env:
          PLAYWRIGHT_CROSS_BROWSER: "1"
          PLAYWRIGHT_SEMANTIC_SUITE: skip

      - name: Test the GitHub Pages production export
        if: github.event_name == 'pull_request'
        run: npm run test:pages
        env:
          PAGES_BASE_PATH: /RhymeGraph
          PAGES_SITE_ORIGIN: https://sjmakin.github.io
          PLAYWRIGHT_CROSS_BROWSER: "1"
